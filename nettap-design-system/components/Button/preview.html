<!doctype html>
<html data-theme="ember">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Button preview</title></head>
<body>
<div style="display:flex;flex-wrap:wrap;gap:var(--sp-2);align-items:center">
  <button class="btn primary" type="button"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7h11l-3-3M17 17H6l3 3"/></svg>View connections</button>
  <button class="btn" type="button"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>Find in PCAP</button>
  <button class="btn" type="button"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 3.5v5h-5"/></svg>Try again</button>
  <button class="icon-btn" type="button" aria-label="Refresh"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.7L20 8.5"/><path d="M20 3.5v5h-5"/></svg></button>
  <button class="icon-btn" type="button" aria-label="Notifications, 3 unread"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="badge-dot" aria-hidden="true">3</span></button>
  <button class="icon-btn ghost" type="button" aria-label="Sign out"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3M10 17l5-5-5-5M15 12H4"/></svg></button>
  <a class="link" href="#">View alerts <svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
</div>
</body>
</html>
