<!doctype html>
<html data-theme="ember">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>NetTap cover</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
.cv { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--bg); }
.cv svg { position: absolute; inset: 0; }
.slab { fill: var(--accent); }
.b2 { fill: var(--data-2); }
.b4 { fill: var(--data-4); }
.b3 { fill: var(--data-3); }
.home { fill: var(--text-1); }
.ring { fill: none; stroke: var(--text-1); stroke-width: 2; }
.cut { fill: var(--bg); }
.txt { position: absolute; left: 40px; bottom: 36px; max-width: 440px; }
.name { font: 500 120px/0.92 var(--font-display); letter-spacing: -0.04em; color: var(--text-1); margin: 0; }
.tagline { font: 400 14px/1.4 var(--font-body); color: var(--text-2); margin: 16px 0 0; }
</style></head>
