<!-- @dsCard group="Status" height=150 -->
<!doctype html>
<html data-theme="ember">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>SeverityPill preview</title></head>
<body>
<div style="display:grid;gap:var(--sp-4)">
  <div class="chips"><span class="sev sev-critical"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 .5 9.5 5 5 9.5.5 5z"/></svg>Critical</span><span class="sev sev-high"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9.4 9H.6z"/></svg>High</span><span class="sev sev-medium"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1.5"/></svg>Medium</span><span class="sev sev-low"><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4"/></svg>Low</span><span class="sev sev-info"><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.4" class="hollow"/></svg>Info</span></div>
  <div class="sev-counts" style="max-width:520px">
    <div class="sev-count"><span class="sev sev-critical"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 .5 9.5 5 5 9.5.5 5z"/></svg>Critical</span><b>1</b></div><div class="sev-count"><span class="sev sev-high"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M5 1 9.4 9H.6z"/></svg>High</span><b>5</b></div><div class="sev-count"><span class="sev sev-medium"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x="1" y="1" width="8" height="8" rx="1.5"/></svg>Medium</span><b>12</b></div><div class="sev-count"><span class="sev sev-low"><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="4"/></svg>Low</span><b>15</b></div><div class="sev-count"><span class="sev sev-info"><svg viewBox="0 0 10 10" aria-hidden="true"><circle cx="5" cy="5" r="3.4" class="hollow"/></svg>Info</span><b>4</b></div>
  </div>
  <div class="chips" style="gap:var(--sp-4)"><span class="res">Completed</span><span class="res is-live">Ongoing</span><span class="res is-medium">No reply</span><span class="res is-high">Reset</span></div>
</div>
</body>
</html>
