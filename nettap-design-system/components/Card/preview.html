<!-- @dsCard group="Layout" height=260 -->
<!doctype html>
<html data-theme="ember">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Card preview</title></head>
<body>
<div class="grid">
  <article class="card hero c-6">
    <div class="card-head"><div><h2 class="card-title">Bandwidth over time</h2><p class="card-sub">GB per hour · busiest at 21:00</p></div>
      <ul class="legend"><li><span class="sw line c-d1"></span>Download</li><li><span class="sw line c-d2"></span>Upload</li></ul></div>
    <p class="dim" style="font-size:var(--text-sm)">Hero card: the corner glow marks the main chart on a screen.</p>
  </article>
  <article class="card col c-6">
    <div class="card-head"><div><h2 class="card-title">Network protocols</h2><p class="card-sub">Share of 182,406 sessions</p></div><a class="link" href="#">View alerts <svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a></div>
    <span class="eyebrow">Most common</span>
    <div class="card-foot"><div class="foot-stat"><span>Encrypted sessions</span><b>77%</b></div>
      <div class="meter" role="meter" aria-label="Encrypted sessions" aria-valuenow="77" aria-valuemin="0" aria-valuemax="100"><span style="width:77%"></span></div>
      <span>HTTPS and QUIC. Plain HTTP is 4%.</span></div>
  </article>
</div>
</body>
</html>
