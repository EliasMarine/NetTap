<!doctype html>
<html data-theme="ember">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>KpiCard preview</title></head>
<body>
<div class="grid">
  <article class="card kpi c-6">
    <div class="kpi-top"><span>Bandwidth</span><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 6-6"/></svg></div>
    <div class="kpi-num">39.2<span class="kpi-unit">GB</span></div>
    <div class="kpi-meta"><span class="chip"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 8v9H8"/></svg>−13%</span><span>vs previous 24 h</span></div>
    <div class="kpi-sub">↓ 31.8 GB down · ↑ 7.4 GB up</div>
  </article>
  <article class="card kpi c-6">
    <div class="kpi-top"><span>Active devices</span><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></div>
    <div class="kpi-num">34</div>
    <div class="kpi-meta"><span class="chip is-ok"><svg class="ic " viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>2 new today</span><span>from Changelog</span></div>
    <div class="kpi-foot"><div class="stackbar" role="img" aria-label="34 devices: 14 computers and phones, 12 smart home, 6 media, 2 other"><div class="sb-track"><span class="c-d1" style="flex:14"></span><span class="c-d2" style="flex:12"></span><span class="c-d3" style="flex:6"></span><span class="c-d5" style="flex:2"></span></div>
      <ul class="sb-legend" aria-hidden="true"><li><span class="sw c-d1"></span>Computers <b>14</b></li><li><span class="sw c-d2"></span>Smart home <b>12</b></li><li><span class="sw c-d3"></span>Media <b>6</b></li><li><span class="sw c-d5"></span>Other <b>2</b></li></ul></div></div>
  </article>
</div>
</body>
</html>
