<!-- @dsCard group="Data" height=330 -->
<!doctype html>
<html data-theme="ember">
<head><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><meta charset="utf-8"><title>Charts preview</title></head>
<body>
<div class="grid">
<article class="card hero c-8"><div class="card-head"><div><h2 class="card-title">Bandwidth over time</h2><p class="card-sub">GB per hour · busiest at 21:00</p></div><ul class="legend"><li><span class="sw line c-d1"></span>Download</li><li><span class="sw line c-d2"></span>Upload</li></ul></div><div class="chart" id="area"></div></article>
<article class="card c-4"><div class="card-head"><div><h2 class="card-title">Network protocols</h2><p class="card-sub">Share of 182,406 sessions</p></div></div><div class="chart" id="donut" style="display:grid;place-items:center"></div></article>
</div><script>
(function(){
var down=[0.5,0.35,0.25,0.25,0.25,0.35,0.75,1.35,1.6,1.45,1.25,1.35,1.5,1.45,1.35,1.6,2.0,2.6,3.2,3.7,4.3,4.7,3.55,1.7];
var up=[0.12,0.1,0.08,0.08,0.08,0.1,0.18,0.3,0.38,0.42,0.4,0.41,0.44,0.43,0.4,0.42,0.45,0.5,0.55,0.48,0.42,0.38,0.25,0.15];
function mono(p){var n=p.length,dx=[],m=[],t=[],i;for(i=0;i<n-1;i++){dx[i]=p[i+1][0]-p[i][0];m[i]=(p[i+1][1]-p[i][1])/dx[i];}t[0]=m[0];
for(i=1;i<n-1;i++)t[i]=m[i-1]*m[i]<=0?0:3*(dx[i-1]+dx[i])/((2*dx[i]+dx[i-1])/m[i-1]+(dx[i]+2*dx[i-1])/m[i]);t[n-1]=m[n-2];
var f=function(v){return v.toFixed(1)},d='M'+f(p[0][0])+','+f(p[0][1]);for(i=0;i<n-1;i++){var h=dx[i]/3;d+='C'+f(p[i][0]+h)+','+f(p[i][1]+t[i]*h)+' '+f(p[i+1][0]-h)+','+f(p[i+1][1]-t[i+1]*h)+' '+f(p[i+1][0])+','+f(p[i+1][1]);}return d;}
function area(w){var H=220,P={l:50,r:12,t:18,b:28},n=24,iw=w-P.l-P.r,ih=H-P.t-P.b,max=5,step=1;
var X=function(i){return P.l+iw*i/(n-1)},Y=function(v){return P.t+ih*(1-v/max)};
var s='<svg viewBox="0 0 '+w+' '+H+'" width="'+w+'" height="'+H+'" role="img" aria-label="Bandwidth per hour. Busiest hour 21:00, with 4.7 GB downloaded."><defs><linearGradient id="ga1" class="g-1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="st-top"/><stop offset="1" class="st-bot"/></linearGradient><linearGradient id="ga2" class="g-2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" class="st-top"/><stop offset="1" class="st-bot"/></linearGradient></defs>';
for(var k=0;k<=5;k++){var y=Y(k).toFixed(1);s+='<line class="gl'+(k?' dash':'')+'" x1="'+P.l+'" x2="'+(w-P.r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(P.l-10)+'" y="'+(+y+4)+'" text-anchor="end">'+(k?k+' GB':'0')+'</text>';}
for(var i=0;i<n;i+=4)s+='<text class="ax" x="'+X(i).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle">'+(i<10?'0':'')+i+':00</text>';
var bw=iw/(n-1)*1.6;s+='<rect class="band" x="'+(X(21)-bw/2).toFixed(1)+'" y="'+P.t+'" width="'+bw.toFixed(1)+'" height="'+ih+'" rx="10"/>';
[[up,2],[down,1]].forEach(function(a){var d=mono(a[0].map(function(v,i){return[X(i),Y(v)]}));s+='<path d="'+d+'L'+X(n-1).toFixed(1)+','+Y(0).toFixed(1)+'L'+X(0).toFixed(1)+','+Y(0).toFixed(1)+'Z" fill="url(#ga'+a[1]+')"/><path class="line ln-'+a[1]+'" d="'+d+'"/>';});
s+='<circle class="dot dot-1" cx="'+X(21).toFixed(1)+'" cy="'+Y(4.7).toFixed(1)+'" r="4.5"/><circle class="dot dot-2" cx="'+X(21).toFixed(1)+'" cy="'+Y(0.38).toFixed(1)+'" r="4.5"/>';
var txt='21:00 · ↓ 4.7 GB · ↑ 380 MB',tw=Math.round(txt.length*6.2+24),tx=Math.min(Math.max(X(21)-tw/2,2),w-tw-2),ty=Math.max(Y(4.7)-38,0);
s+='<rect class="tip-bg" x="'+tx.toFixed(1)+'" y="'+ty.toFixed(1)+'" width="'+tw+'" height="24" rx="12"/><text class="tip-tx" x="'+(tx+tw/2).toFixed(1)+'" y="'+(ty+16).toFixed(1)+'" text-anchor="middle">'+txt+'</text>';
return s+'</svg>';}
function donut(){var S=150,c=S/2,sw=12,r=c-sw/2-2,C=2*Math.PI*r,items=[[105795,1],[34657,2],[25537,3],[7296,4],[9121,5]],tot=182406,gap=4+sw,off=0,s='<svg viewBox="0 0 '+S+' '+S+'" width="'+S+'" height="'+S+'" role="img" aria-label="Protocol share: HTTPS 58%, QUIC 19%, DNS 14%, HTTP 4%, Other 5%">';
items.forEach(function(it){var len=C*it[0]/tot,dash=Math.max(len-gap,0.01);s+='<circle class="seg ln-'+it[1]+'" cx="'+c+'" cy="'+c+'" r="'+r.toFixed(2)+'" stroke-dasharray="'+dash.toFixed(2)+' '+(C-dash).toFixed(2)+'" stroke-dashoffset="'+(-(off+gap/2)).toFixed(2)+'" transform="rotate(-90 '+c+' '+c+')"/>';off+=len;});
return s+'<text class="d-num" x="'+c+'" y="'+(c+6)+'" text-anchor="middle">182k</text><text class="d-lbl" x="'+c+'" y="'+(c+26)+'" text-anchor="middle">sessions</text></svg>';}
var el=document.getElementById('area');function draw(){el.innerHTML=area(Math.max(280,Math.round(el.clientWidth)));}
draw();new ResizeObserver(draw).observe(el);document.getElementById('donut').innerHTML=donut();
})();
</script>
</body>
</html>
