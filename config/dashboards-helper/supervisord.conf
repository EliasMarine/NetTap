; NetTap override of Malcolm's dashboards-helper supervisord config.
;
; Why: with Malcolm's default PUSER_PRIV_DROP=true the entrypoint `su`s to the
; helper user before starting supervisord, and that user cannot reopen
; /dev/fd/1 (root-owned pipe, l-wx------). Every program then failed with
; "unknown error making dispatchers ... EACCES", so idxinit and the cron jobs
; never ran: no index pattern, no dashboards, no field refresh in OpenSearch
; Dashboards (tracking-fixes/2026-11-01-dashboard-data-accuracy.md #73).
; Same mechanism and fix as logstash (NET-54, config/logstash/supervisord.conf).
;
; Fix: PUSER_PRIV_DROP=false (compose) so supervisord runs as root and can open
; /dev/fd/1, and user=helper below so every program still runs as helper, the
; user Malcolm's own privilege drop would have used.
;
; Original: ghcr.io/idaholab/malcolm/dashboards-helper:26.10.0 /etc/supervisord.conf
; (ported from 26.02.0's: the only upstream change is idxinit's command, below)
; Copyright (c) 2026 Battelle Energy Alliance, LLC.  All rights reserved.

[unix_http_server]
file=/tmp/supervisor.sock   ; (the path to the socket file)
chmod=0700

[supervisord]
nodaemon=true
loglevel=error
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[program:idxinit]
user=helper
; OLD CODE START — Malcolm 26.02.0's command; 26.10.0 moved it into index-init.sh
; command=bash -c "sleep 180 && /usr/local/bin/opensearch_status.sh -w && /usr/local/bin/index-refresh.py -vvv --dashboards \"%(ENV_DASHBOARDS_URL)s\" --opensearch \"%(ENV_OPENSEARCH_URL)s\" --opensearch-mode \"%(ENV_OPENSEARCH_PRIMARY)s\" --opensearch-curlrc \"%(ENV_OPENSEARCH_CREDS_CONFIG_FILE)s\" --opensearch-ssl-verify %(ENV_OPENSEARCH_SSL_CERTIFICATE_VERIFICATION)s --template malcolm_template --unassigned"
; OLD CODE END
; OLD CODE START — 26.10.0-only: 26.02.0 has no index-init.sh, so idxinit went
; FATAL after the update rolled back to 26.02.0 (#134)
; command=/usr/local/bin/index-init.sh 180
; OLD CODE END
; Both releases: this file is shared by the update and its rollback.
command=bash -c "if [ -x /usr/local/bin/index-init.sh ]; then exec /usr/local/bin/index-init.sh 180; else sleep 180 && /usr/local/bin/opensearch_status.sh -w && /usr/local/bin/index-refresh.py -vvv --dashboards \"%(ENV_DASHBOARDS_URL)s\" --opensearch \"%(ENV_OPENSEARCH_URL)s\" --opensearch-mode \"%(ENV_OPENSEARCH_PRIMARY)s\" --opensearch-curlrc \"%(ENV_OPENSEARCH_CREDS_CONFIG_FILE)s\" --opensearch-ssl-verify %(ENV_OPENSEARCH_SSL_CERTIFICATE_VERIFICATION)s --template malcolm_template --unassigned; fi"
autostart=true
autorestart=false
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
directory=/data
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:maps]
user=helper
command=/usr/bin/goStatic
  -path /opt/maps
  -port %(ENV_OFFLINE_REGION_MAPS_PORT)s
  -append-header 'Access-Control-Allow-Origin:*'
  -enable-health
  -vhost ''
autostart=true
autorestart=true
startsecs=0
startretries=0
stopasgroup=true
killasgroup=true
directory=/opt/maps
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:cron]
user=helper
autostart=true
autorestart=true
command=/usr/local/bin/supercronic -json "%(ENV_SUPERCRONIC_CRONTAB)s"
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
