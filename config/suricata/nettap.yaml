%YAML 1.1
---
# NetTap Suricata include. Mounted at /opt/suricata/include-configs/nettap.yaml; Malcolm adds every
# include-configs/**/*.yaml to the end of the suricata.yaml it generates at container start, so these
# keys override its defaults. Suricata needs the %YAML 1.1 header above in included files too.

# Device-local suppressions (e.g. proxyware on a device the owner runs it on), written by the deploy
# script; the file always exists, empty when there are none (NET-191).
threshold-file: /etc/nettap/suricata-threshold.config

