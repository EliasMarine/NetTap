# ==========================================================================
# NetTap CI Pipeline — Lint, Test, Build
# ==========================================================================
# Runs on every push to main and on all pull requests.
# Validates shell scripts, Python daemon, SvelteKit web app, and Docker builds.

name: CI

on:
  push:
    # develop stays listed deliberately so CI covers it if the branch ever returns
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ========================================================================
  # Shell Script Linting
  # ========================================================================
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # OLD CODE START — the action downloads shellcheck "stable" on every run, and since
      # 2026-11-09 the runner gets a file that isn't an archive ("This does not look like a tar
      # archive"), failing main and every PR. The runner image already ships shellcheck.
      # - name: Run ShellCheck on all scripts
      #   uses: ludeeus/action-shellcheck@2.0.0
      #   with:
      #     scandir: scripts/
      #     severity: warning
      # OLD CODE END
      - name: Run ShellCheck on all scripts
        run: |
          shellcheck --version
          find scripts -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 shellcheck -S warning

  # ========================================================================
  # Python Linting (ruff)
  # ========================================================================
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned: an unpinned ruff changes its default rules and formatter between releases
        run: pip install ruff==0.17.3

      - name: Ruff check (lint)
        run: ruff check daemon/

      - name: Ruff format check
        run: ruff format --check daemon/

  # ========================================================================
  # SvelteKit Type Checking
  # ========================================================================
  lint-web:
    name: Lint Web (svelte-check)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/

      # Before svelte-check, so these still run while its known red baseline stands
      - name: Colour gate
        run: npm run check:colors
        working-directory: web/

      - name: Type-check visual harness fixtures
        run: npm run check:e2e
        working-directory: web/

      - name: Run svelte-check
        run: npx svelte-check --tsconfig ./tsconfig.json
        working-directory: web/

  # ========================================================================
  # Python Tests
  # ========================================================================
  test-daemon:
    name: Test Daemon (Python)
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: daemon/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r daemon/requirements.txt
          pip install pytest pytest-asyncio pytest-cov

      - name: Run pytest
        run: python3 -m pytest daemon/tests/ -v --tb=short

  # ========================================================================
  # Web Tests
  # ========================================================================
  test-web:
    name: Test Web (Vitest)
    runs-on: ubuntu-latest
    needs: lint-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/

      - name: Run vitest
        run: npx vitest run
        working-directory: web/

  # ========================================================================
  # Visual Tests — first run only (the full suite takes ~8 minutes)
  # ========================================================================
  # Setup and Go Live before the first admin exists, on the production build against
  # the fixture daemon. NET-259 (Go Live bounced to /login) was caught only by hand.
  test-visual-firstrun:
    name: Visual tests (first run)
    # Playwright 1.58 has no Chromium for ubuntu-latest (26.04); move with a Playwright upgrade
    runs-on: ubuntu-24.04
    needs: lint-web
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: web/

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: web/

      - name: Run first-run visual tests
        run: npm run test:visual -- --project=firstrun
        working-directory: web/

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-firstrun-results
          path: web/test-results/visual/
          retention-days: 7

  # ========================================================================
  # Docker Image Builds (verify they build, do not push)
  # ========================================================================
  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [test-daemon, test-web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: daemon
            dockerfile: docker/Dockerfile.daemon
          - image: web
            dockerfile: docker/Dockerfile.web
          - image: tshark
            dockerfile: docker/Dockerfile.tshark
          - image: cyberchef
            dockerfile: docker/Dockerfile.cyberchef
          # Compiles and self-tests the RDRAND fix without pulling the 1.4 GB Malcolm base
          - image: zeek-live
            dockerfile: docker/Dockerfile.zeek-live
            target: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          target: ${{ matrix.target }}
          push: false
          tags: nettap/${{ matrix.image }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
