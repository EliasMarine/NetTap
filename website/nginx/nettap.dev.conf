# nettap.dev: the NetTap marketing site. Master copy: website/deploy.sh installs it on nginx-local as
# /etc/nginx/sites-available/nettap.dev. Edit it here, never on the box.
# Releases live in /var/www/nettap.dev/releases/<release>; "current" points at the live one.

# BEGIN http (deploy.sh installs only this block to get the first certificate)
server {
    listen 80;
    server_name nettap.dev www.nettap.dev;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
    }
    location / { return 301 https://nettap.dev$request_uri; }
}
# END http

server {
    listen 443 ssl http2;
    server_name www.nettap.dev;
    ssl_certificate /etc/letsencrypt/live/nettap.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nettap.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://nettap.dev$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nettap.dev;
    ssl_certificate /etc/letsencrypt/live/nettap.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nettap.dev/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/nettap.dev/current;
    index index.html;
    error_page 404 /404.html;

    # nginx.conf only gzips text/html
    gzip_vary on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    # The hash is the inline js-class line in every page (build.sh checks it). The Buy Me a Coffee footer button
    # needs its script, Google Fonts and inline styles; 'unsafe-inline' styles also cover the static style="--i:0" attributes.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-/x7W7R75k8Roq0WaVRQX9blP4OufE5xbAdzklGxsgpw=' https://cdnjs.buymeacoffee.com/1.0.0/button.prod.min.js; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Pages, CSS and JS revalidate on every visit, because file names aren't hashed.
    # expires (not add_header) so the security headers above still apply in the location below.
    expires -1;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
    location ~* \.(woff2|jpg|png|svg)$ {
        expires 30d;
    }
}
