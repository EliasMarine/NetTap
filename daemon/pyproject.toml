[project]
name = "nettap-daemon"
version = "0.2.0"
description = "NetTap storage & health monitoring daemon"
requires-python = ">=3.11"
dependencies = [
    "opensearch-py>=2.4.0,<3.0",
    "aiohttp>=3.9.0,<4.0",
    "pySMART>=1.3.0,<2.0",
    "psutil>=5.9.0,<6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
]

[tool.ruff.lint]
# Pin the rule set. Ruff 0.17 widened its defaults from E4/E7/E9/F to ~400 rules,
# which turned the daemon from 5 lint errors into 700+ with no code change.
select = ["E4", "E7", "E9", "F"]
