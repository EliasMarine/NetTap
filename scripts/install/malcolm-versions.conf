# NetTap — Malcolm version pins
# These control which Malcolm container images are pulled during deployment.
# Update these when upgrading to a new tested Malcolm release.

MALCOLM_IMAGE_REGISTRY="ghcr.io/idaholab/malcolm"
MALCOLM_IMAGE_TAG="26.10.0"

# Individual image names (all under the same registry)
MALCOLM_IMG_OPENSEARCH="opensearch"
MALCOLM_IMG_DASHBOARDS="dashboards"
MALCOLM_IMG_DASHBOARDS_HELPER="dashboards-helper"
MALCOLM_IMG_LOGSTASH="logstash-oss"
MALCOLM_IMG_FILEBEAT="filebeat-oss"
MALCOLM_IMG_ZEEK="zeek"
MALCOLM_IMG_SURICATA="suricata"
MALCOLM_IMG_ARKIME="arkime"
MALCOLM_IMG_PCAP_CAPTURE="pcap-capture"
MALCOLM_IMG_NGINX_PROXY="nginx-proxy"
# OLD CODE START — 2026-11-03: Malcolm 26.04.0+ ships Valkey; there is no redis image
# MALCOLM_IMG_REDIS="redis"
# OLD CODE END
MALCOLM_IMG_REDIS="valkey"  # the compose "redis" service (MALCOLM_KV_IMAGE in docker/.env)
MALCOLM_IMG_API="api"
